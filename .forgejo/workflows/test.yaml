name: test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: nixos-do-s
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Zig dependency set, realised from `build.zig.zon.nix`, so that
      # the steps below build against the store rather than fetching from a
      # forge in the middle of a test run.
      - name: Fetch the Zig dependencies
        run: echo "ZIG_DEPS=$(nix build --print-out-paths .#zig-deps)" >> "$FORGE_ENV"

      - name: Check REUSE compliance
        run: nix develop -c reuse lint

      - name: Check Zig formatting compliance
        run: nix develop -c zig fmt --check .

      - name: Test
        run: nix develop -c zig build test --summary all --system "$ZIG_DEPS"

      - name: Build
        run: nix develop -c zig build --system "$ZIG_DEPS"

      # Nothing else builds the documentation server or the stand-in for the
      # PipeWire module, so without this either could stop compiling and the
      # test step would not notice.
      - name: Build everything that is not built by the steps above
        run: nix develop -c zig build check --system "$ZIG_DEPS"

      # The package builds in the Nix sandbox, which has no network at all:
      # if `build.zig.zon.nix` has drifted from `build.zig.zon`, this is
      # where it shows.
      - name: Build the package
        run: nix build .#wopr

  # Published only from main, so that a branch build cannot replace the site
  # with a work in progress, and only after `test` has passed, so that it
  # cannot document a tree that does not compile.
  docs:
    needs: test
    if: ${{ forge.ref == 'refs/heads/main' }}
    runs-on: nixos-do-s
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build API docs
        run: nix develop -c zig build docs --system "$(nix build --print-out-paths .#zig-deps)"

      - name: Publish docs
        run: >
          nix develop -c git-pages-cli https://jeff.jcollie.page/wopr/
          --server jcollie.page
          --token ${{ forge.token }}
          --upload-dir zig-out/docs

# The scripts in `analysis/` are deliberately not run here. They measure the
# reference recording, which is a clip of a commercial film's soundtrack and
# so is not in the repository; there is nothing for them to read. What they
# establish is instead asserted by `tests/acoustics.zig`, which needs no
# audio file because it renders its own.
