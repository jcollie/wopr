name: test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: nixos-do-s
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check REUSE compliance
        run: nix develop -c reuse lint

      - name: Check Zig formatting compliance
        run: nix develop -c zig fmt --check .

      # `--system` points Zig at the dependency set realised from
      # `build.zig.zon.nix`, so these build against the store rather than
      # fetching from a forge in the middle of a test run. Recomputed per
      # step rather than carried in an environment file: `nix build` costs
      # nothing once the path is there, and the name of the file a Forgejo
      # runner exports for that is not something to depend on.
      - name: Test
        run: nix develop -c zig build test --summary all --system "$(nix build --print-out-paths .#zig-deps)"

      - name: Build
        run: nix develop -c zig build --system "$(nix build --print-out-paths .#zig-deps)"

      # Nothing else builds the documentation server or the stand-in for the
      # PipeWire module, so without this either could stop compiling and the
      # test step would not notice.
      - name: Build everything that is not built by the steps above
        run: nix develop -c zig build check --system "$(nix build --print-out-paths .#zig-deps)"

      # The package builds in the Nix sandbox, which has no network at all:
      # if `build.zig.zon.nix` has drifted from `build.zig.zon`, this is
      # where it shows.
      - name: Build the package
        run: nix build .#wopr

  # Published only from main, so that a branch build cannot replace the site
  # with a work in progress, and only after `test` has passed, so that it
  # cannot document a tree that does not compile -- or publish a sample
  # rendered by one.
  site:
    needs: test
    if: ${{ forge.ref == 'refs/heads/main' }}
    runs-on: nixos-do-s
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The page, the sample it plays, and the API documentation under
      # `api/`. The sample is rendered here by the commit being published,
      # from a fixed seed, so it comes out byte-identical unless the
      # synthesis changed -- and the incremental upload below then has
      # nothing to send rather than five megabytes every push.
      - name: Build the site
        run: nix develop -c zig build site --system "$(nix build --print-out-paths .#zig-deps)"

      - name: Publish the site
        run: >
          nix develop -c git-pages-cli https://jeff.jcollie.page/wopr/
          --server jcollie.page
          --token ${{ forge.token }}
          --upload-dir zig-out/site

# The scripts in `analysis/` are deliberately not run here. They measure the
# reference recording, which is a clip of a commercial film's soundtrack and
# so is not in the repository; there is nothing for them to read. What they
# establish is instead asserted by `tests/acoustics.zig`, which needs no
# audio file because it renders its own.
