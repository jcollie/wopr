version = 1
SPDX-PackageName = "riff"
SPDX-PackageSupplier = "Jeffrey C. Ollie <jeff@ocjtech.us>"
SPDX-PackageDownloadLocation = "https://git.jcollie.dev/jeff/zig-riff"

# Files that cannot carry a header of their own: one is generated, and the Zig
# manifest has no comment syntax that survives `zig fetch --save` rewriting it.
[[annotations]]
path = ["flake.lock", "build.zig.zon", "build.zig.zon.nix"]
precedence = "aggregate"
